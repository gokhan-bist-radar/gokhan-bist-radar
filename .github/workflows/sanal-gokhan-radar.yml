name: SANAL_GOKHAN_RADAR_TEK_CATI

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions tam saat ve yarim saatlerde yogunlasabildigi icin
    # taramalar bilerek 06, 21, 36 ve 51. dakikalara dagitildi.
    # Turkiye saatiyle hafta ici 10:06-17:51 arasi 15 dakikada bir.
    - cron: '6,21,36,51 7-14 * * 1-5'

concurrency:
  group: sanal-gokhan-radar
  cancel-in-progress: false

jobs:
  scan-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: write

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Repo indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutuphaneleri yukle
        run: |
          pip install -r requirements.txt

      - name: Tek cati radar calistir
        run: |
          python gokhan_bist_radar_v13.py

      - name: Radar hafizasini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add radar_memory.csv radar_signals.csv radar_performance.csv

          if git diff --cached --quiet; then
            echo "Kaydedilecek yeni radar verisi yok."
            exit 0
          fi

          git commit -m "Radar update $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Gecikmis veya pes pese gelen calismalarda push cakismasini azaltir.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push denemesi $attempt basarisiz; yeniden deneniyor..."
            sleep $((attempt * 10))
          done

          echo "Radar verisi 3 denemede de GitHub'a yazilamadi."
          exit 1
